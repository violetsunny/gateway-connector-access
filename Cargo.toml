[workspace]
members = ["crates/*", "learn-demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
connector-common = { path = "crates/connector-common", version = "0.1.0" }
connector-http = { path = "crates/connector-http", version = "0.1.0" }
connector-modbus-tcp = { path = "crates/connector-modbus-tcp", version = "0.1.0" }
connector-mqtt = { path = "crates/connector-mqtt", version = "0.1.0" }
connector-opcua = { path = "crates/connector-opcua", version = "0.1.0" }
connector-request = { path = "crates/connector-request", version = "0.1.0" }
connector-snmp = { path = "crates/connector-snmp", version = "0.1.0" }
connector-tcp = { path = "crates/connector-tcp", version = "0.1.0" }
connector-udp = { path = "crates/connector-udp", version = "0.1.0" }
cron = "0.17.0"
flate2 = "1.1.10"
governor = "0.10.4"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde", "send"] }
mqtt-broker = { path = "crates/mqtt-broker", version = "0.1.0" }
opcua = "0.12.0"
rand = "0.10.2"
rdkafka = "0.39"
reqwest = "0.13.5"
rumqttc = "0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-modbus = "0.17.0"
toml = "1"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
